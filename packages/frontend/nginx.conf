# Static-file server for the Aether frontend (standalone deployments only).
# The default deployment serves these same files from the backend instead.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # would keep serving the previous bundle.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: anything that is not a file serves the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
